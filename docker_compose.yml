version: "3.9"

services:

  db:

    image: postgres:17

    restart: unless-stopped

    environment:

      POSTGRES_USER: ${POSTGRES_USER:-postgres}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      POSTGRES_DB: ${POSTGRES_DB:-ims_dev}

    volumes:

      - db_data:/var/lib/postgresql/data

    ports:

      - "${POSTGRES_PORT:-5432}:5432"

  backend:

    build:

      context: ./backend

      dockerfile: Dockerfile

    env_file:

      - .env

    depends_on:

      - db

    ports:

      - "8000:8000"

    volumes:

      - ./backend:/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:

    build:

      context: ./frontend

      dockerfile: Dockerfile

    env_file:

      - .env

    ports:

      - "3000:3000"

    volumes:

      - ./frontend:/app

    command: pnpm dev --hostname 0.0.0.0 --port 3000

  adminer:

    image: adminer

    restart: unless-stopped

    ports:
    
      - "8080:8080"

volumes:

  db_data:
  