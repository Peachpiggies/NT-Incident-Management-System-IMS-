[alembic]
script_location = alembic
# Alembic is installed outside this repository in CI, so add the backend
# directory explicitly before importing ``app`` from alembic/env.py.
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://ims:change-me-for-local-development@db:5432/ims

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = 
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
