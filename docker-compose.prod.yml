# Production compose file: no bind mounts, no --reload/dev servers,
# builds default (production) targets from each Dockerfile.
# Usage: docker compose -f docker-compose.prod.yml up --build -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ims_network
    # No published port to the host in production; only `backend` needs to
    # reach `db`, and that happens over the internal network.

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8002"
    # Runs pending Alembic migrations, then hands off to the image's own
    # CMD (uvicorn, no --reload) — no volume mount, code is baked into the image.
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/v1/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ims_network

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - ims_network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ims_network

networks:
  ims_network:
    driver: bridge

volumes:
  postgres_data: