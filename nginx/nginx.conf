user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Matches backend's own attachment size cap (settings.max_attachment_bytes
    # = 10_000_000 bytes); rejecting oversized uploads here saves a round
    # trip to the backend for something it would reject anyway. A small
    # margin is added for multipart overhead.
    client_max_body_size 11m;

    # Rate limiting: keyed by client IP, applied per-location below.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

    upstream backend_upstream {
        server backend:8002;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    # Shared security headers. X-Frame-Options/CSP are deliberately not
    # hardened further here (e.g. strict CSP) since the frontend's actual
    # script/style sources aren't finalized yet — revisit once the UI is built.
    map $sent_http_content_type $x_content_type_options {
        default "nosniff";
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "$x_content_type_options" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --- WebSocket: realtime notifications ---
        # Must be matched before the general /api/ block below, since it
        # needs the Upgrade/Connection headers that a plain proxy_pass
        # would not forward.
        location /api/v1/ws/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket connections are long-lived; the default 60s proxy
            # read timeout would otherwise silently kill idle connections.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- Auth endpoints: tighter rate limit against credential stuffing ---
        location /api/v1/auth/ {
            limit_req zone=api_auth burst=10 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # --- Backend API (everything else under /api) ---
        location /api/ {
            limit_req zone=api_general burst=40 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # --- FastAPI's own docs/openapi (proxied under /api too) ---
        location = /docs {
            proxy_pass http://backend_upstream/docs;
            proxy_set_header Host $host;
        }

        location = /api/v1/openapi.json {
            proxy_pass http://backend_upstream/api/v1/openapi.json;
            proxy_set_header Host $host;
        }

        # --- Next.js static assets: safe to cache aggressively, filenames are hashed ---
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # --- Everything else: Next.js app (pages, RSC payloads, etc.) ---
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Next.js dev mode uses a websocket for HMR; harmless to allow
            # upgrade headers through here too even in production.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
